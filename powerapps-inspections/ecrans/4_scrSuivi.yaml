- galSuivi:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =16
      Y: =258
      Width: =1334
      Height: =500
      Items: =Sort(Filter(INS_Reponses, Reponse = "N" && Applicable = "Oui" && (gblVoirRealises || StatutCorrectif <> "Réalisé") && (IsBlank(txtSuiviRech.Text) || StartsWith(Endroit, txtSuiviRech.Text) || StartsWith(Responsable, txtSuiviRech.Text))), Echeance, SortOrder.Ascending)
      TemplateSize: =70
      TemplatePadding: =0
      ShowScrollbar: =true
      OnSelect: |-
        =With({i: LookUp(INS_Inspections, ID = ThisItem.InspectionID)},
            Set(gblInspID, i.ID);
            Set(gblInspCle, Coalesce(i.IdInspection, Text(GUID())));
            Set(gblInfo, {Endroit: i.Title, Service: i.Service, Inspecteur: i.Inspecteur, DateInspection: Coalesce(i.DateInspection, Today()), Participants: i.Participants});
            Set(gblNA, Coalesce(i.SectionsNA, ""));
            Set(gblSignature, Coalesce(i.Signature, ""))
        );
        ClearCollect(colSaved, Filter(INS_Reponses, InspectionID = gblInspID));
        ClearCollect(
            colReponses,
            ForAll(
                nfItems As it,
                With({s: LookUp(colSaved, ItemID = it.Cle)},
                    {LigneID: Coalesce(s.ID, 0), Cle: it.Cle, SectionNo: it.SectionNo, Element: it.Element, EstAutre: false, Reponse: s.Reponse, Gravite: s.Gravite, Commentaire: s.Commentaire, Emplacement: s.Emplacement, Responsable: s.Responsable, Echeance: s.Echeance, Statut: s.StatutCorrectif, DateRealise: s.DateRealise}
                )
            )
        );
        Collect(
            colReponses,
            ForAll(
                Sort(Filter(colSaved, SectionNo = 21), ID) As s,
                {LigneID: s.ID, Cle: s.ItemID, SectionNo: 21, Element: s.Title, EstAutre: true, Reponse: s.Reponse, Gravite: s.Gravite, Commentaire: s.Commentaire, Emplacement: s.Emplacement, Responsable: s.Responsable, Echeance: s.Echeance, Statut: s.StatutCorrectif, DateRealise: s.DateRealise}
            )
        );
        Clear(colSupprimes);
        Set(gblSection, 1);
        Set(gblDetail, "");
        Set(gblModifie, false);
        Set(gblAvertiQuitter, false);
        Navigate(scrInspection, ScreenTransition.None)
    Children:
    - lblSEndroit:
        Control: Label
        Properties:
          X: =8
          Y: =4
          Width: =250
          Height: =60
          Text: =ThisItem.Endroit & Char(10) & ThisItem.Service & "  ·  " & Text(ThisItem.DateInspection, "yyyy-mm-dd")
          Size: =9
          Color: =ColorValue("#1f2937")
          FontWeight: =FontWeight.Bold
    - lblSElement:
        Control: Label
        Properties:
          X: =264
          Y: =4
          Width: =300
          Height: =60
          Text: =ThisItem.Sujet & " — " & ThisItem.Title
          Size: =9
          Color: =ColorValue("#1f2937")
    - lblSGravite:
        Control: Label
        Properties:
          X: =570
          Y: =18
          Width: =40
          Height: =32
          Text: =Coalesce(ThisItem.Gravite, "—")
          Size: =10
          Color: =ColorValue("#ffffff")
          FontWeight: =FontWeight.Bold
          Fill: =Switch(ThisItem.Gravite, "E", ColorValue("#dc2626"), "F", ColorValue("#ea580c"), ColorValue("#94a3b8"))
          Align: =Align.Center
    - lblSCorrectif:
        Control: Label
        Properties:
          X: =616
          Y: =4
          Width: =260
          Height: =60
          Text: =ThisItem.Commentaire & If(IsBlank(ThisItem.Emplacement), "", " (" & ThisItem.Emplacement & ")")
          Size: =9
          Color: =ColorValue("#334155")
    - txtSResp:
        Control: Classic/TextInput
        Properties:
          X: =882
          Y: =16
          Width: =160
          Height: =36
          Default: =ThisItem.Responsable
          OnChange: |-
            =If(Self.Text <> Coalesce(ThisItem.Responsable, ""),
                With({x: ThisItem.InspectionID},
                    Patch(INS_Reponses, ThisItem, {Responsable: Self.Text});
                    With({lst: Filter(INS_Reponses, InspectionID = x && Reponse = "N" && Applicable = "Oui")},
                    Patch(
                        INS_Inspections,
                        LookUp(INS_Inspections, ID = x),
                        {
                            CorrectifsOuverts: CountIf(lst, StatutCorrectif <> "Réalisé"),
                            ProchaineEcheance: Min(Filter(lst, StatutCorrectif <> "Réalisé" && !IsBlank(Echeance)), Echeance),
                            StatutSuivi: If(
                                CountRows(lst) = 0, "Aucun correctif",
                                CountIf(lst, StatutCorrectif <> "Réalisé") = 0, "Fermé",
                                CountIf(lst, StatutCorrectif = "En cours" || StatutCorrectif = "Réalisé") > 0, "En cours",
                                "Ouvert"
                            )
                        }
                    )
                );
                    Notify("Correctif mis à jour.", NotificationType.Success)
                )
            )
          HintText: ="Responsable"
          Size: =10
          BorderColor: =ColorValue("#cbd5e1")
    - dpSEch:
        Control: Classic/DatePicker
        Properties:
          X: =1048
          Y: =16
          Width: =150
          Height: =36
          DefaultDate: =ThisItem.Echeance
          Format: ="yyyy-mm-dd"
          Size: =9
          BorderColor: =If(!IsBlank(ThisItem.Echeance) && ThisItem.Echeance < Today() && ThisItem.StatutCorrectif <> "Réalisé", ColorValue("#dc2626"), ColorValue("#cbd5e1"))
          BorderThickness: =2
          OnChange: |-
            =If(Self.SelectedDate <> ThisItem.Echeance,
                With({x: ThisItem.InspectionID},
                    Patch(INS_Reponses, ThisItem, {Echeance: Self.SelectedDate});
                    With({lst: Filter(INS_Reponses, InspectionID = x && Reponse = "N" && Applicable = "Oui")},
                    Patch(
                        INS_Inspections,
                        LookUp(INS_Inspections, ID = x),
                        {
                            CorrectifsOuverts: CountIf(lst, StatutCorrectif <> "Réalisé"),
                            ProchaineEcheance: Min(Filter(lst, StatutCorrectif <> "Réalisé" && !IsBlank(Echeance)), Echeance),
                            StatutSuivi: If(
                                CountRows(lst) = 0, "Aucun correctif",
                                CountIf(lst, StatutCorrectif <> "Réalisé") = 0, "Fermé",
                                CountIf(lst, StatutCorrectif = "En cours" || StatutCorrectif = "Réalisé") > 0, "En cours",
                                "Ouvert"
                            )
                        }
                    )
                );
                    Notify("Correctif mis à jour.", NotificationType.Success)
                )
            )
    - ddSStatut:
        Control: Classic/DropDown
        Properties:
          X: =1204
          Y: =16
          Width: =112
          Height: =36
          Items: =["À faire", "En cours", "Réalisé"]
          Default: =Coalesce(ThisItem.StatutCorrectif, "À faire")
          OnChange: |-
            =If(Self.Selected.Value <> ThisItem.StatutCorrectif,
                With({x: ThisItem.InspectionID},
                    Patch(INS_Reponses, ThisItem, {StatutCorrectif: Self.Selected.Value, DateRealise: If(Self.Selected.Value = "Réalisé", Today(), Blank())});
                    With({lst: Filter(INS_Reponses, InspectionID = x && Reponse = "N" && Applicable = "Oui")},
                    Patch(
                        INS_Inspections,
                        LookUp(INS_Inspections, ID = x),
                        {
                            CorrectifsOuverts: CountIf(lst, StatutCorrectif <> "Réalisé"),
                            ProchaineEcheance: Min(Filter(lst, StatutCorrectif <> "Réalisé" && !IsBlank(Echeance)), Echeance),
                            StatutSuivi: If(
                                CountRows(lst) = 0, "Aucun correctif",
                                CountIf(lst, StatutCorrectif <> "Réalisé") = 0, "Fermé",
                                CountIf(lst, StatutCorrectif = "En cours" || StatutCorrectif = "Réalisé") > 0, "En cours",
                                "Ouvert"
                            )
                        }
                    )
                );
                    Notify("Correctif mis à jour.", NotificationType.Success)
                )
            )
          AllowEmptySelection: =false
          Size: =10
    - recSSep:
        Control: Rectangle
        Properties:
          X: =0
          Y: =Parent.TemplateHeight - 1
          Width: =Parent.TemplateWidth
          Height: =1
          Fill: =ColorValue("#e2e8f0")
