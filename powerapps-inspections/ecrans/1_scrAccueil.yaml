- btnConfirmerSuppr:
    Control: Classic/Button
    Properties:
      X: =427
      Y: =400
      Width: =240
      Height: =44
      Text: ="Supprimer"
      OnSelect: |-
        =Remove(INS_Reponses, Filter(INS_Reponses, InspectionID = gblASupprimer.ID));
        Remove(INS_Inspections, gblASupprimer);
        Set(gblASupprimer, Blank());
        Notify("Inspection supprimée.", NotificationType.Success)
      Fill: =ColorValue("#dc2626")
      Color: =ColorValue("#ffffff")
      HoverFill: =ColorFade(ColorValue("#dc2626"), -15%)
      Size: =11
      BorderThickness: =0
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
      Visible: =!IsBlank(gblASupprimer)
