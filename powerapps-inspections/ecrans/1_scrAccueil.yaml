- btnNouvelleInspection:
    Control: Classic/Button
    Properties:
      X: =968
      Y: =10
      Width: =190
      Height: =36
      Text: ="+ Nouvelle inspection"
      OnSelect: |-
        =Set(gblInspID, Blank());
        Set(gblInspCle, Text(GUID()));
        Set(gblInfo, {Endroit: "", Service: "", Inspecteur: User().FullName, DateInspection: Today(), Participants: ""});
        Set(gblNA, "");
        Set(gblSignature, "");
        ClearCollect(colReponses, ForAll(nfItems As it, Patch(nfReponseVide, {Cle: it.Cle, SectionNo: it.SectionNo, Element: it.Element, Echeance: Blank(), DateRealise: Blank()})));
        Clear(colSupprimes);
        Set(gblSection, 1);
        Set(gblDetail, "");
        Set(gblModifie, false);
        Set(gblAvertiQuitter, false);
        Navigate(scrInspection, ScreenTransition.None)
      Fill: =ColorValue("#16a34a")
      Color: =ColorValue("#ffffff")
      HoverFill: =ColorFade(ColorValue("#16a34a"), -15%)
      Size: =11
      BorderThickness: =0
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
