- galInspections:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =16
      Y: =172
      Width: =1334
      Height: =586
      Items: =Sort(Filter(INS_Inspections, IsBlank(txtRechAccueil.Text) || StartsWith(Title, txtRechAccueil.Text) || StartsWith(Service, txtRechAccueil.Text) || StartsWith(Inspecteur, txtRechAccueil.Text)), DateInspection, SortOrder.Descending)
      TemplateSize: =76
      TemplatePadding: =0
      OnSelect: |-
        =With({i: LookUp(INS_Inspections, ID = ThisItem.ID)},
            Set(gblInspID, i.ID);
            Set(gblInspCle, Coalesce(i.IdInspection, Text(GUID())));
            Set(gblInfo, {Endroit: i.Title, Service: i.Service, Inspecteur: i.Inspecteur, DateInspection: Coalesce(i.DateInspection, Today()), Participants: i.Participants});
            Set(gblNA, Coalesce(i.SectionsNA, ""));
            Set(gblSignature, Coalesce(i.Signature, ""))
        );
        ClearCollect(colSaved, Filter(INS_Reponses, InspectionID = gblInspID));
        ClearCollect(
            colReponses,
            ForAll(
                nfItems As it,
                With({s: LookUp(colSaved, ItemID = it.Cle)},
                    {LigneID: Coalesce(s.ID, 0), Cle: it.Cle, SectionNo: it.SectionNo, Element: it.Element, EstAutre: false, Reponse: s.Reponse, Gravite: s.Gravite, Commentaire: s.Commentaire, Emplacement: s.Emplacement, Responsable: s.Responsable, Echeance: s.Echeance, Statut: s.StatutCorrectif, DateRealise: s.DateRealise}
                )
            )
        );
        Collect(
            colReponses,
            ForAll(
                Sort(Filter(colSaved, SectionNo = 21), ID) As s,
                {LigneID: s.ID, Cle: s.ItemID, SectionNo: 21, Element: s.Title, EstAutre: true, Reponse: s.Reponse, Gravite: s.Gravite, Commentaire: s.Commentaire, Emplacement: s.Emplacement, Responsable: s.Responsable, Echeance: s.Echeance, Statut: s.StatutCorrectif, DateRealise: s.DateRealise}
            )
        );
        Clear(colSupprimes);
        Set(gblSection, 1);
        Set(gblDetail, "");
        Set(gblModifie, false);
        Set(gblAvertiQuitter, false);
        Navigate(scrInspection, ScreenTransition.None)
      ShowScrollbar: =true
    Children:
    - lblAccEndroit:
        Control: Label
        Properties:
          X: =12
          Y: =6
          Width: =560
          Height: =30
          Text: =Coalesce(ThisItem.Title, "(sans endroit)")
          Size: =13
          Color: =ColorValue("#1f2937")
          FontWeight: =FontWeight.Bold
    - lblAccService:
        Control: Label
        Properties:
          X: =12
          Y: =38
          Width: =560
          Height: =28
          Text: =ThisItem.Service & If(IsBlank(ThisItem.Inspecteur), "", "  ·  " & ThisItem.Inspecteur)
          Size: =10
          Color: =ColorValue("#64748b")
    - lblAccDate:
        Control: Label
        Properties:
          X: =590
          Y: =6
          Width: =160
          Height: =30
          Text: =Text(ThisItem.DateInspection, "yyyy-mm-dd")
          Size: =11
          Color: =ColorValue("#1f2937")
          FontWeight: =FontWeight.Bold
    - lblAccStats:
        Control: Label
        Properties:
          X: =590
          Y: =38
          Width: =480
          Height: =28
          Text: =Coalesce(ThisItem.NbNonConformes, 0) & " non-conformité(s)  ·  " & Coalesce(ThisItem.NbGraviteElevee, 0) & " gravité E  ·  " & Coalesce(ThisItem.CorrectifsOuverts, 0) & " à réaliser" & If(IsBlank(ThisItem.ProchaineEcheance), "", "  ·  prochaine éch. " & Text(ThisItem.ProchaineEcheance, "yyyy-mm-dd"))
          Size: =10
          Color: =ColorValue("#64748b")
    - lblAccStatut:
        Control: Label
        Properties:
          X: =1080
          Y: =20
          Width: =150
          Height: =32
          Text: =Coalesce(ThisItem.StatutSuivi, "—")
          Size: =10
          Color: =ColorValue("#ffffff")
          FontWeight: =FontWeight.Bold
          Fill: =Switch(ThisItem.StatutSuivi, "Ouvert", ColorValue("#dc2626"), "En cours", ColorValue("#ea580c"), "Fermé", ColorValue("#16a34a"), ColorValue("#64748b"))
          Align: =Align.Center
    - icoAccSupprimer:
        Control: Classic/Icon
        Properties:
          X: =1250
          Y: =16
          Width: =44
          Height: =44
          Icon: =Icon.Trash
          OnSelect: =Set(gblASupprimer, ThisItem)
          Color: =ColorValue("#dc2626")
          Tooltip: ="Supprimer cette inspection"
          PaddingTop: =6
          PaddingBottom: =6
          PaddingLeft: =6
          PaddingRight: =6
    - recAccSep:
        Control: Rectangle
        Properties:
          X: =0
          Y: =Parent.TemplateHeight - 1
          Width: =Parent.TemplateWidth
          Height: =1
          Fill: =ColorValue("#e2e8f0")
