- ddAMCategorie:
    Control: Classic/DropDown
    Properties:
      X: =16
      Y: =128
      Width: =220
      Height: =34
      Items: =["Toutes", "Physique", "Mécanique", "Électrique", "Chimique", "Biologique", "Humain", "Ergonomique"]
      Default: ="Toutes"
      AllowEmptySelection: =false
      Size: =10
