- galAnalyses:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =16
      Y: =172
      Width: =1334
      Height: =586
      Items: =Sort(Filter(AR_Analyses, IsBlank(txtRechAccueil.Text) || StartsWith(Title, txtRechAccueil.Text) || StartsWith(Division, txtRechAccueil.Text) || StartsWith(Localisation, txtRechAccueil.Text)), DateAnalyse, SortOrder.Descending)
      TemplateSize: =76
      TemplatePadding: =0
      OnSelect: |-
        =Set(gblAnalyseID, ThisItem.ID);
        Set(gblMeta, {Service: ThisItem.Title, Division: ThisItem.Division, Localisation: ThisItem.Localisation, Participants: ThisItem.Participants, DateAnalyse: Coalesce(ThisItem.DateAnalyse, Today()), Commentaires: ThisItem.Commentaires});
        ClearCollect(
            colLignes,
            ForAll(
                Sort(Filter(AR_Lignes, AnalyseID = gblAnalyseID), Ordre),
                {
                    LigneID: ThisRecord.ID,
                    Cle: Coalesce(ThisRecord.Cle, Text(GUID())),
                    Ordre: Coalesce(ThisRecord.Ordre, 0),
                    Environnement: ThisRecord.Environnement,
                    Activite: ThisRecord.Title,
                    Tache: ThisRecord.Tache,
                    CategorieDanger: ThisRecord.CategorieDanger,
                    Risque: ThisRecord.Risque,
                    Consequence: ThisRecord.Consequence,
                    Blessure: ThisRecord.Blessure,
                    MesuresExistantes: ThisRecord.MesuresExistantes,
                    G1: Coalesce(ThisRecord.G1, 0),
                    MP1: Coalesce(ThisRecord.MP1, 0),
                    MesuresSuggerees: ThisRecord.MesuresSuggerees,
                    Cout: ThisRecord.Cout,
                    G2: Coalesce(ThisRecord.G2, 0),
                    MP2: Coalesce(ThisRecord.MP2, 0)
                }
            )
        );
        Clear(colSupprimes);
        Set(gblModifie, false);
        Set(gblAvertiQuitter, false);
        Navigate(scrAnalyse, ScreenTransition.None)
      ShowScrollbar: =true
    Children:
    - lblAccService:
        Control: Label
        Properties:
          X: =12
          Y: =6
          Width: =560
          Height: =30
          Text: =Coalesce(ThisItem.Title, "(sans service)")
          Size: =13
          Color: =ColorValue("#1f2937")
          FontWeight: =FontWeight.Bold
    - lblAccDivision:
        Control: Label
        Properties:
          X: =12
          Y: =38
          Width: =560
          Height: =28
          Text: =ThisItem.Division & If(IsBlank(ThisItem.Localisation), "", "  ·  " & ThisItem.Localisation)
          Size: =10
          Color: =ColorValue("#64748b")
    - lblAccDate:
        Control: Label
        Properties:
          X: =590
          Y: =6
          Width: =160
          Height: =30
          Text: =Text(ThisItem.DateAnalyse, "yyyy-mm-dd")
          Size: =11
          Color: =ColorValue("#1f2937")
          FontWeight: =FontWeight.Bold
    - lblAccStats:
        Control: Label
        Properties:
          X: =590
          Y: =38
          Width: =480
          Height: =28
          Text: =Coalesce(ThisItem.NbRisques, 0) & " risque(s)  ·  " & Coalesce(ThisItem.NbCritiques, 0) & " critique(s)  ·  " & Coalesce(ThisItem.NbEleves, 0) & " élevé(s)  ·  IR max " & Coalesce(ThisItem.IRMax, 0)
          Size: =10
          Color: =ColorValue("#64748b")
    - lblAccStatut:
        Control: Label
        Properties:
          X: =1080
          Y: =20
          Width: =150
          Height: =32
          Text: =Coalesce(ThisItem.Statut, "Enregistrée")
          Size: =10
          Color: =ColorValue("#ffffff")
          FontWeight: =FontWeight.Bold
          Fill: =If(ThisItem.Statut = "Envoyée", ColorValue("#16a34a"), ColorValue("#2563eb"))
          Align: =Align.Center
    - icoAccSupprimer:
        Control: Classic/Icon
        Properties:
          X: =1250
          Y: =16
          Width: =44
          Height: =44
          Icon: =Icon.Trash
          OnSelect: =Set(gblASupprimer, ThisItem)
          Color: =ColorValue("#dc2626")
          Tooltip: ="Supprimer cette analyse"
          PaddingTop: =6
          PaddingBottom: =6
          PaddingLeft: =6
          PaddingRight: =6
    - recAccSeparateur:
        Control: Rectangle
        Properties:
          X: =0
          Y: =Parent.TemplateHeight - 1
          Width: =Parent.TemplateWidth
          Height: =1
          Fill: =ColorValue("#e2e8f0")
