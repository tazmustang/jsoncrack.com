      HoverFill: =ColorFade(ColorValue("#16a34a"), -15%)
      Size: =11
      BorderThickness: =0
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
