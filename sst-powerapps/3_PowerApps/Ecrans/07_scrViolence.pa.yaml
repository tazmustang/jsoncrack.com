            - vio_navBas:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  Height: =60
                  PaddingTop: =16
                  FillPortions: =0
                Children:
                  - vio_btnDeposerBas:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="☁️ Enregistrer et déposer"
                        OnSelect: |-
                          =UpdateContext({locManquants: Concat(Filter(Table(
                              {c: "Identification de la personne qui déclare la situation", ok: !(true) || !(IsBlank(vio_rdoDeclarantRole.Selected.Value))},
                              {c: "Nom de l'employé qui déclare la situation", ok: !(true) || !(IsBlank(vio_txtEmpNom.Text))},
                              {c: "Prénom de l'employé qui déclare la situation", ok: !(true) || !(IsBlank(vio_txtEmpPrenom.Text))},
                              {c: "Numéro d'employé (ID)", ok: !(true) || !(IsBlank(vio_txtEmpID.Text))},
                              {c: "ID (6 chiffres)", ok: !(true) || !(!IsMatch(vio_txtEmpID.Text, "\d{6}"))},
                              {c: "Syndicat auquel l'employé est rattaché", ok: !(true) || !(IsBlank(vio_drpEmpSyndicat.Selected.Value))},
                              {c: "Prénom et nom du supérieur immédiat", ok: !(true) || !(IsBlank(vio_txtEmpSuperieur.Text))},
                              {c: "Service auquel est rattaché l'employé (unité administrative)", ok: !(true) || !(IsBlank(vio_drpEmpService.Selected.Value))},
                              {c: "Date de l'évènement", ok: !(true) || !(IsBlank(vio_dteEvtDate.SelectedDate))},
                              {c: "Heure exacte ou approximative de l'évènement", ok: !(true) || !(IsBlank(vio_txtEvtHeure.Text))},
                              {c: "Lieu de l'évènement", ok: !(true) || !(IsBlank(vio_txtEvtAdresse.Text))},
                              {c: "Précisez les tâches au moment de l'évènement", ok: !(true) || !(IsBlank(vio_txmTache.Text))},
                              {c: "Type d'évènement", ok: !(true) || !(IsBlank(Concat(Filter(vio_galViolTypes.AllItems, vio_chkViolTypes.Value), Value, "; ")))},
                              {c: "Description de l'évènement, selon la version de l'employé", ok: !(true) || !(IsBlank(vio_txmDescription.Text))},
                              {c: "Récidive (employé ayant déjà été victime d'un évènement similaire)", ok: !(true) || !(IsBlank(vio_rdoRecidive.Selected.Value))},
                              {c: "Est-ce qu'il y a des témoins ?", ok: !(true) || !(IsBlank(vio_rdoTemoins.Selected.Value))},
                              {c: "Mesures correctives immédiates", ok: !(true) || !(IsBlank(vio_txmMesurePrev.Text))},
                              {c: "Mesures correctives mises en œuvre par", ok: !(true) || !(IsBlank(vio_txtViolMesuresPar.Text))},
                              {c: "En plus de déclarer cet évènement à la Division SST, j'aimerais, en tant que gestionnaire, solliciter l'aide du Comité bouclier", ok: !(true) || !(IsBlank(vio_rdoComiteBouclier.Selected.Value))},
                              {c: "Nom du gestionnaire qui complète le formulaire", ok: !(true) || !(IsBlank(vio_txtGestNom.Text))},
                              {c: "Employé impliqué : « J'étais présent(e) lorsque mon gestionnaire a complété ce formulaire. Il s'agit de ma version des faits et je confirme que la description de l'évènement est exacte. »", ok: !(true) || !(IsBlank(vio_rdoApprobationEmp.Selected.Value))},
                              {c: "L'employé désire recevoir sa copie de la déclaration dans le format suivant", ok: !(true) || !(IsBlank(vio_rdoFormatCopie.Selected.Value))},
                              {c: "Courriel de l'employé", ok: !(true) || !(IsBlank(vio_txtEmpCourriel.Text))},
                              {c: "Courriel de l'employé (format invalide)", ok: !(true) || !(!IsMatch(vio_txtEmpCourriel.Text, Match.Email))}), !ok), c, " • ")});
                          If(!IsBlank(locManquants),
                            Notify("Champs obligatoires à compléter : " & locManquants, NotificationType.Error),
                            IfError(
                            Set(varDossier, Patch(SST_Dossiers, If(IsBlank(varDossier.ID), Defaults(SST_Dossiers), varDossier),
                            {DeclarantRole: vio_rdoDeclarantRole.Selected.Value,
                            EmpNom: vio_txtEmpNom.Text,
                            EmpPrenom: vio_txtEmpPrenom.Text,
                            EmpID: vio_txtEmpID.Text,
                            EmpSyndicat: vio_drpEmpSyndicat.Selected.Value,
                            EmpSuperieur: vio_txtEmpSuperieur.Text,
                            EmpService: vio_drpEmpService.Selected.Value,
                            EmpDirection: vio_drpEmpDirection.Selected.Value,
                            EmpDivision: vio_drpEmpDivision.Selected.Value,
                            EmpSection: vio_drpEmpSection.Selected.Value,
                            EvtDate: vio_dteEvtDate.SelectedDate,
                            EvtHeure: vio_txtEvtHeure.Text,
                            EvtAdresse: vio_txtEvtAdresse.Text,
                            Tache: vio_txmTache.Text,
                            ViolTypes: Concat(Filter(vio_galViolTypes.AllItems, vio_chkViolTypes.Value), Value, "; "),
                            Description: vio_txmDescription.Text,
                            AuteurNom: vio_txtAuteurNom.Text,
                            AuteurAdresse: vio_txtAuteurAdresse.Text,
                            AuteurInfo: vio_txmAuteurInfo.Text,
                            Recidive: vio_rdoRecidive.Selected.Value,
                            RecidiveDetails: vio_txmRecidiveDetails.Text,
                            Temoins: vio_rdoTemoins.Selected.Value,
                            TemoinsNoms: vio_txmTemoinsNoms.Text,
                            TemoinsCoord: vio_txmTemoinsCoord.Text,
                            ViolMesuresPrises: Concat(Filter(vio_galViolMesuresPrises.AllItems, vio_chkViolMesuresPrises.Value), Value, "; "),
                            MesurePrev: vio_txmMesurePrev.Text,
                            ViolMesuresPar: vio_txtViolMesuresPar.Text,
                            ComiteBouclier: vio_rdoComiteBouclier.Selected.Value,
                            GestNom: vio_txtGestNom.Text,
                            ApprobationEmp: vio_rdoApprobationEmp.Selected.Value,
                            FormatCopie: vio_rdoFormatCopie.Selected.Value,
                            EmpCourriel: vio_txtEmpCourriel.Text,
                            TypeFormulaire: "Violence",
                            Title: "Violence – " & vio_txtEmpNom.Text & ", " & vio_txtEmpPrenom.Text & " – " & Text(vio_dteEvtDate.SelectedDate, "yyyy-mm-dd"),
                            CreeParCourriel: Coalesce(varDossier.CreeParCourriel, varMoi),
                            CreeParNom: Coalesce(varDossier.CreeParNom, User().FullName),
                            DateMesures: If(IsBlank(vio_txmMesurePrev.Text), varDossier.DateMesures, Coalesce(varDossier.DateMesures, Today())),
                            DateApprobation: If(vio_rdoApprobationEmp.Selected.Value = "Oui", Coalesce(varDossier.DateApprobation, Today()), varDossier.DateApprobation),
                            Statut: If(IsBlank(varDossier.Statut) || varDossier.Statut = "Brouillon", "Déposé", varDossier.Statut),
                            DateDeclaration: Coalesce(varDossier.DateDeclaration, Today())}));
                            Notify("Dossier n° " & varDossier.ID & " déposé.", NotificationType.Success);
                            Set(varAutoEnvoi, true);
                            Navigate(scrApercu, ScreenTransition.None),
                            Notify("Erreur d'enregistrement : " & FirstError.Message, NotificationType.Error)))
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cVert
                        Color: =Color.White
                        BorderThickness: =0
                        HoverFill: =ColorFade(cVert, -0.15)
                        PressedFill: =ColorFade(cVert, -0.3)
                        HoverColor: =Color.White
                        PressedColor: =Color.White
                        Width: =240
                        Height: =38
