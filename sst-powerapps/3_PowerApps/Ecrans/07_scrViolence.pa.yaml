            - vio_info74:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Le Comité bouclier a pour mission : 1) de soutenir et protéger les employés victimes de harcèlement, d'intimidation, de diffamation ou de gestes violents commis par un citoyen, un fournisseur ou tout autre tiers externe; 2) d'accompagner les gestionnaires dans la gestion de ces situations; 3) d'analyser chaque situation dénoncée et, le cas échéant, de prendre des mesures pour la corriger. Actions possibles : juridiques, policières, communications internes ou externes, soutien à l'employé. Le comité est formé de gestionnaires de la Direction générale, du Service de police, des Ressources humaines, de l'Interaction citoyenne, des Communications, des Affaires juridiques, de l'Arrondissement de La Cité-Limoilou, de la Gestion du territoire et de la Gestion des matières résiduelles et de la valorisation."
