Screens:
  scrApercu:
    Properties:
      Fill: =cFond
      OnVisible: |-
        =ClearCollect(colNoeudsPdf, Filter(SST_Pourquoi, DossierID = varDossier.ID));
        UpdateContext({locReset: true});
        UpdateContext({locReset: false});
        If(varAutoEnvoi, Set(varAutoEnvoi, false); Select(apc_btnEnvoyer))
