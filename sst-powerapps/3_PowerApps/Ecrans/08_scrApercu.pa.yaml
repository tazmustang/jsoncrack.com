      - apc_galEtapes:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Items: |-
              =Switch(varDossier.TypeFormulaire,
                "Situation dangereuse", Table(
                  {n: 1, t: "Signalement", d: varDossier.DateDeclaration},
                  {n: 2, t: "Prise en charge", d: varDossier.DateEnquete},
                  {n: 3, t: "Mesure corrective", d: varDossier.DatePlanAction},
                  {n: 4, t: "Fermeture", d: varDossier.DateFermeture}),
                "Violence", Table(
                  {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},
                  {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},
                  {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},
                  {n: 4, t: "Suivi SST / Bouclier", d: varDossier.DateEnquete},
                  {n: 5, t: "Fermeture", d: varDossier.DateFermeture}),
                Table(
                  {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},
                  {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},
                  {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},
                  {n: 4, t: "Enquête", d: varDossier.DateEnquete},
                  {n: 5, t: "Analyse 5 Pourquoi", d: varDossier.DateAnalyse},
                  {n: 6, t: "Plan d'action", d: varDossier.DatePlanAction},
                  {n: 7, t: "Fermeture", d: varDossier.DateFermeture}))
            TemplateSize: =150
            TemplatePadding: =0
            ShowScrollbar: =false
            X: |-
              =Max(210, (Parent.Width - 150 * CountRows(Switch(varDossier.TypeFormulaire,   "Situation dangereuse", Table(     {n: 1, t: "Signalement", d: varDossier.DateDeclaration},     {n: 2, t: "Prise en charge", d: varDossier.DateEnquete},     {n: 3, t: "Mesure corrective", d: varDossier.DatePlanAction},     {n: 4, t: "Fermeture", d: varDossier.DateFermeture}),   "Violence", Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Suivi SST / Bouclier", d: varDossier.DateEnquete},     {n: 5, t: "Fermeture", d: varDossier.DateFermeture}),   Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Enquête", d: varDossier.DateEnquete},     {n: 5, t: "Analyse 5 Pourquoi", d: varDossier.DateAnalyse},     {n: 6, t: "Plan d'action", d: varDossier.DatePlanAction},     {n: 7, t: "Fermeture", d: varDossier.DateFermeture})))) / 2)
            Y: =118
            Width: |-
              =150 * CountRows(Switch(varDossier.TypeFormulaire,   "Situation dangereuse", Table(     {n: 1, t: "Signalement", d: varDossier.DateDeclaration},     {n: 2, t: "Prise en charge", d: varDossier.DateEnquete},     {n: 3, t: "Mesure corrective", d: varDossier.DatePlanAction},     {n: 4, t: "Fermeture", d: varDossier.DateFermeture}),   "Violence", Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Suivi SST / Bouclier", d: varDossier.DateEnquete},     {n: 5, t: "Fermeture", d: varDossier.DateFermeture}),   Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Enquête", d: varDossier.DateEnquete},     {n: 5, t: "Analyse 5 Pourquoi", d: varDossier.DateAnalyse},     {n: 6, t: "Plan d'action", d: varDossier.DatePlanAction},     {n: 7, t: "Fermeture", d: varDossier.DateFermeture})))
            Height: =72
            BorderThickness: =0
          Children:
            - apc_stpLigne:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(!IsBlank(LookUp(Switch(varDossier.TypeFormulaire,   "Situation dangereuse", Table(     {n: 1, t: "Signalement", d: varDossier.DateDeclaration},     {n: 2, t: "Prise en charge", d: varDossier.DateEnquete},     {n: 3, t: "Mesure corrective", d: varDossier.DatePlanAction},     {n: 4, t: "Fermeture", d: varDossier.DateFermeture}),   "Violence", Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Suivi SST / Bouclier", d: varDossier.DateEnquete},     {n: 5, t: "Fermeture", d: varDossier.DateFermeture}),   Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Enquête", d: varDossier.DateEnquete},     {n: 5, t: "Analyse 5 Pourquoi", d: varDossier.DateAnalyse},     {n: 6, t: "Plan d'action", d: varDossier.DatePlanAction},     {n: 7, t: "Fermeture", d: varDossier.DateFermeture})), n = ThisItem.n + 1).d), cVert, cBordure)
                  BorderThickness: =0
                  X: =75.0
                  Y: =21
                  Width: =150
                  Height: =3
                  Visible: |-
                    =ThisItem.n < CountRows(Switch(varDossier.TypeFormulaire,   "Situation dangereuse", Table(     {n: 1, t: "Signalement", d: varDossier.DateDeclaration},     {n: 2, t: "Prise en charge", d: varDossier.DateEnquete},     {n: 3, t: "Mesure corrective", d: varDossier.DatePlanAction},     {n: 4, t: "Fermeture", d: varDossier.DateFermeture}),   "Violence", Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Suivi SST / Bouclier", d: varDossier.DateEnquete},     {n: 5, t: "Fermeture", d: varDossier.DateFermeture}),   Table(     {n: 1, t: "Déclaration", d: varDossier.DateDeclaration},     {n: 2, t: "Mesures immédiates", d: varDossier.DateMesures},     {n: 3, t: "Approbation employé", d: varDossier.DateApprobation},     {n: 4, t: "Enquête", d: varDossier.DateEnquete},     {n: 5, t: "Analyse 5 Pourquoi", d: varDossier.DateAnalyse},     {n: 6, t: "Plan d'action", d: varDossier.DatePlanAction},     {n: 7, t: "Fermeture", d: varDossier.DateFermeture})))
            - apc_stpRond:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(IsBlank(ThisItem.d), Text(ThisItem.n), "✓")
                  OnSelect: =false
                  Fill: =If(IsBlank(ThisItem.d), cGrisLib, cVert)
                  Color: =Color.White
                  BorderThickness: =0
                  HoverFill: =If(IsBlank(ThisItem.d), cGrisLib, cVert)
                  PressedFill: =If(IsBlank(ThisItem.d), cGrisLib, cVert)
                  HoverColor: =Color.White
                  PressedColor: =Color.White
                  DisabledFill: =If(IsBlank(ThisItem.d), cGrisLib, cVert)
                  DisabledColor: =Color.White
                  DisplayMode: =DisplayMode.View
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  TabIndex: =-1
                  X: =59.0
                  Y: =6
                  Width: =32
            - apc_stpNom:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.t
                  Color: =If(IsBlank(ThisItem.d), cTexte2, cTexte)
                  Size: =10
                  X: =0
                  Y: =40
                  Width: =150
                  Height: =18
                  Align: =Align.Center
                  FontWeight: =FontWeight.Semibold
            - apc_stpDate:
                Control: Label@2.5.1
                Properties:
                  Text: =If(IsBlank(ThisItem.d), "", Text(ThisItem.d, "yyyy-mm-dd"))
                  Color: =cTexte2
                  Size: =9
                  X: =0
                  Y: =56
                  Width: =150
                  Height: =16
                  Align: =Align.Center
      - apc_pilNo:
          Control: Classic/Button@2.2.0
