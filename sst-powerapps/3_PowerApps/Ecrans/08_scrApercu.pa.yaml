      - apc_conApercu:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            Fill: =Color.White
            BorderThickness: =1
            DropShadow: =DropShadow.None
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =6
            LayoutAlignItems: =LayoutAlignItems.Stretch
            BorderColor: =cBordure
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            X: =24
            Y: =204
            Width: =Parent.Width - 400
            Height: =Parent.Height - 220
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =32
            PaddingLeft: =Max(24, (Self.Width - 940) / 2)
            PaddingRight: =Max(24, (Self.Width - 940) / 2)
          Children:
            - apc_htmApercu:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =Switch(varDossier.TypeFormulaire,
                     "Situation dangereuse", "<html><head><meta charset='utf-8'><style>@page{margin:18mm} body{margin:0}</style></head><body>" & "<div style='font-family:Segoe UI,Arial,sans-serif;color:#1F2937;font-size:10pt'><div style='height:8px;background:#857650;margin-bottom:10px'></div><h1 style='color:#00285E;font-size:18pt;margin:6px 0'>" & Switch(varDossier.TypeFormulaire, "Situation dangereuse", "Signalement d'une situation dangereuse", "Violence", "Déclaration d'un évènement traumatisant et d'acte de violence", "Déclaration d'" & Lower(varDossier.TypeFormulaire) & " de travail") & "</h1>" & "<p style='color:#6B7280;font-size:9pt;margin:0 0 12px'>Dossier n° " & varDossier.ID & " · Statut : " & varDossier.Statut & " · Déposé le " & Coalesce(Text(varDossier.DateDeclaration, "yyyy-mm-dd"), "—") & " · Document généré le " & Text(Now(), "yyyy-mm-dd hh:mm") & "</p>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Vos coordonnées</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.EmpNom), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Votre nom</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpNom, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EmpPrenom), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Votre prénom</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpPrenom, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EmpID), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Votre ID</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpID, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EmpService), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Votre unité administrative</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpService, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EmpCourriel), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Votre courriel</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpCourriel, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Situation dangereuse observée</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.DiscuteGest), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>En avez-vous discuté avec votre gestionnaire ?</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.DiscuteGest, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.SyndicatCopie), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Désirez-vous que votre syndicat / association soit mis en copie de votre signalement ?</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.SyndicatCopie, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EmpSyndicat), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Syndicat / association auquel vous êtes rattaché et qui sera mis en copie</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpSyndicat, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EvtAdresse), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Indiquez l'adresse et le lieu précis où vous avez observé la situation dangereuse</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EvtAdresse, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(Text(varDossier.EvtDate, "yyyy-mm-dd")), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Date de l'observation</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(Text(varDossier.EvtDate, "yyyy-mm-dd"), Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.Description), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Décrire brièvement la situation dangereuse que vous avez observée</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.Description, Char(10), "<br>") & "</td></tr>") &
