                        ).lienpdf);
                        Set(varDossier, Patch(SST_Dossiers, varDossier, {PdfLien: varLienPdf}));
                        Notify("PDF généré" & If(IsBlank(dest), ".", " et envoyé à : " & dest), NotificationType.Success),
