                  OnSelect: |-
                    =With({dest: Concat(Filter(Table({v: cCourrielSST}, {v: If("courriel" in Lower(varDossier.FormatCopie) || varDossier.TypeFormulaire = "Situation dangereuse", varDossier.EmpCourriel)}, {v: If(varDossier.SyndicatCopie = "Oui", LookUp(colListes, Liste = "Syndicat" && Value = varDossier.EmpSyndicat, Courriel))}, {v: If(varDossier.ComiteBouclier = "Oui", cCourrielBouclier)}), !IsBlank(v)), v, ";")},
                      IfError(
                        Set(varLienPdf, SSTGenererPDF.Run(
                          "SST-" & Text(varDossier.ID, "00000") & "_" & Substitute(varDossier.TypeFormulaire, " ", "-") & "_" & Text(Now(), "yyyymmdd-hhmm"),
                          apc_htmApercu.HtmlText,
                          dest,
                          "SST – " & varDossier.TypeFormulaire & " – dossier n° " & varDossier.ID,
