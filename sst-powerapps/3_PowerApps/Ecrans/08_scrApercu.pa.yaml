                      If(IsBlank(varDossier.EnqueteRequise), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Une enquête et analyse d'évènement est-elle requise ?</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EnqueteRequise, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Arrêt de travail</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.ArretTravail), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Arrêt de travail ?</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.ArretTravail, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(Text(varDossier.DateDernierJour, "yyyy-mm-dd")), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Date du dernier jour travaillé</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(Text(varDossier.DateDernierJour, "yyyy-mm-dd"), Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.RetourTravail), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Retour au travail ?</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.RetourTravail, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(Text(varDossier.DateRetour, "yyyy-mm-dd")), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Date du retour</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(Text(varDossier.DateRetour, "yyyy-mm-dd"), Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.ModaliteRetour), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Modalité de retour</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.ModaliteRetour, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Signature / consentement</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.ApprobationEmp), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Employé impliqué : « J'étais présent(e) lorsque mon gestionnaire a complété ce formulaire. Il s'agit de ma version des faits et je confirme que la description de l'évènement est exacte. »</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.ApprobationEmp, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.FormatCopie), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Format souhaité pour la copie de la déclaration</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FormatCopie, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EmpCourriel), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Courriel de l'employé</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EmpCourriel, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                     If(IsBlank(varDossier.DateEnquete) && IsBlank(varDossier.FactOrganisation), "", "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>L'organisation du travail</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.FactOrganisation), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Facteurs constatés</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FactOrganisation, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.FactOrgAutre), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Autre (préciser)</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FactOrgAutre, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>L'environnement et les équipements</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.FactEnvironnement), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Facteurs constatés</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FactEnvironnement, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.FactEnvAutre), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Autre (préciser)</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FactEnvAutre, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Le comportement des personnes concernées</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.FactComportement), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Facteurs constatés</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FactComportement, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.FactCompAutre), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Autre (préciser)</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.FactCompAutre, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Mesures correctives suggérées</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.MesuresSuggerees), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Mesures suggérées</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.MesuresSuggerees, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.MesuresSuggAutre), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Autre (préciser)</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.MesuresSuggAutre, Char(10), "<br>") & "</td></tr>") &
                      "</table>" &
                    "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Version de l'employeur ou tout autre commentaire</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'>" &
                      If(IsBlank(varDossier.GestAccord), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Le gestionnaire opérationnel est-il en accord avec la version du travailleur ?</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.GestAccord, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.GestVersion), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Description détaillée de l'évènement selon le gestionnaire opérationnel</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.GestVersion, Char(10), "<br>") & "</td></tr>") &
                      If(IsBlank(varDossier.EnqueteurNom), "", "<tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top;background:#ECF1F7;width:38%;color:#00285E'>Enquête réalisée par</th><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Substitute(varDossier.EnqueteurNom, Char(10), "<br>") & "</td></tr>") &
                      "</table>") &
                    If(CountRows(colNoeudsPdf) = 0, "",
                     "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Analyse des causes (5 Pourquoi)</h2><p><b>Problème identifié :</b> " & varDossier.Probleme & "<br><b>Analyse menée par :</b> " & varDossier.AnalysteNom & "</p>" &
                     Concat(Sort(colNoeudsPdf, Chemin), "<div style='margin:4px 0 4px " & (Niveau - 1) * 18 & "px;border-left:3px solid " & Switch(Min(Niveau, 5), 1, "#00285E", 2, "#074B98", 3, "#00796B", 4, "#6B3FA0", "#857650") & ";padding:3px 8px;background:#F9FAFB'><b>Pourquoi " & Niveau & " ?</b> " & Texte & If(CauseRacine, " <span style='background:#C80000;color:#FFFFFF;padding:1px 6px;font-size:8pt'>CAUSE RACINE</span>", "") & "</div>") &
                     If(CountRows(Filter(colNoeudsPdf, CauseRacine)) = 0, "",
                      "<h2 style='color:#00285E;font-size:12.5pt;border-bottom:2px solid #857650;padding-bottom:3px;margin:18px 0 8px'>Plan d'action — causes racines</h2><table style='width:100%;border-collapse:collapse;font-size:9.5pt'><tr><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;background:#ECF1F7;color:#00285E'>Cause racine</th><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;background:#ECF1F7;color:#00285E'>Action corrective</th><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;background:#ECF1F7;color:#00285E'>Responsable</th><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;background:#ECF1F7;color:#00285E'>Échéance</th><th style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;background:#ECF1F7;color:#00285E'>Statut</th></tr>" &
                      Concat(Filter(Sort(colNoeudsPdf, Chemin), CauseRacine), "<tr><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Texte & "</td><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & ActionTexte & "</td><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & ActionResp & "</td><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & Text(ActionEcheance, "yyyy-mm-dd") & "</td><td style='border:1px solid #E5E7EB;padding:5px 7px;text-align:left;vertical-align:top'>" & ActionStatut & "</td></tr>") & "</table>")) &
                    "<p style='margin-top:24px;color:#6B7280;font-size:8pt;border-top:1px solid #857650;padding-top:6px'>Formulaire propriété de la Division de la santé et de la sécurité au travail — Ville de Québec</p></div></body></html>")
                  AutoHeight: =true
