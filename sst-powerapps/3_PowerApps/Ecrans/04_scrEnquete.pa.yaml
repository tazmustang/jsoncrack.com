                Variant: Vertical
                Properties:
                  Items: =Sort(Filter(colListes, Liste = "FacteurOrganisation"), Ordre)
                  WrapCount: =2
                  TemplateSize: =40
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Height: =RoundUp(CountRows(Sort(Filter(colListes, Liste = "FacteurOrganisation"), Ordre)) / 2, 0) * 40 + 4
                  BorderThickness: =0
                Children:
                  - enq_chkFactOrganisation:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        Text: =ThisItem.Value
                        Default: =ThisItem.Value in Split(varDossier.FactOrganisation, "; ").Value
                        Reset: =locReset
                        Size: =11
                        Color: =cTexte
                        CheckboxBorderColor: =cTexte2
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth - 8
                        Height: =Parent.TemplateHeight - 4
            - enq_lblFactOrgAutre:
                Control: Label@2.5.1
                Properties:
                  Text: ="Autre (préciser)"
                  Color: =cTexte
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  AutoHeight: =true
                  Wrap: =true
                  PaddingTop: =6
            - enq_txtFactOrgAutre:
