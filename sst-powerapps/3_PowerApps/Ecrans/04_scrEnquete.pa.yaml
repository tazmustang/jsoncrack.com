      - enq_conCorps:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            Fill: =Color.White
            BorderThickness: =1
            DropShadow: =DropShadow.None
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =6
            LayoutAlignItems: =LayoutAlignItems.Stretch
            BorderColor: =cBordure
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            X: =24
            Y: =204
            Width: =Parent.Width - 48
            Height: =Parent.Height - 220
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingTop: =16
            PaddingBottom: =32
            PaddingLeft: =Max(24, (Self.Width - 940) / 2)
            PaddingRight: =Max(24, (Self.Width - 940) / 2)
          Children:
            - enq_info0:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="L'enquête et l'analyse d'accident forment un processus en deux étapes pour éviter qu'un accident ne se reproduise. L'ENQUÊTE (la collecte) : la recherche immédiate des faits. On recueille les indices, prend des photos et interroge les témoins pour savoir ce qui s'est passé. Cette collecte s'appuie sur trois axes : l'organisation du travail (consignes, formations, planification et répartition des tâches); l'environnement et les équipements (état du matériel, aménagement des lieux et contraintes physiques); le comportement des personnes concernées (actions, faits et décisions observés lors de l'évènement). L'ANALYSE (la compréhension) : la recherche des causes. On étudie les faits collectés pour comprendre pourquoi cela s'est passé et identifier les failles. En résumé : l'enquête rassemble les pièces du puzzle, l'analyse les assemble pour corriger le problème."
                  Color: =cMarine
                  Size: =11
                  AutoHeight: =true
                  Wrap: =true
                  Fill: =cBleuPale
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  PaddingBottom: =8
                  BorderColor: =cBleu
                  BorderThickness: =1
            - enq_sec1:
                Control: Label@2.5.1
                Properties:
                  Text: ="L'organisation du travail"
                  Color: =cMarine
                  Size: =16
                  FontWeight: =FontWeight.Bold
                  AutoHeight: =true
                  PaddingTop: =14
                  PaddingBottom: =2
            - enq_ligne2:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =cOr
                  BorderThickness: =0
                  Height: =2
            - enq_lblFactOrganisation:
                Control: Label@2.5.1
                Properties:
                  Text: ="Facteurs constatés" & " *"
                  Color: =cTexte
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  AutoHeight: =true
                  Wrap: =true
                  PaddingTop: =6
            - enq_aideFactOrganisation:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Cet axe examine le cadre, les méthodes et la planification mis en place par l'organisation avant que l'évènement ne survienne. On cherche à savoir si les conditions de travail théoriques étaient adéquates et sécuritaires. Ce qu'on évalue : la clarté des consignes et des procédures de travail; la formation reçue par le travailleur (était-il qualifié/informé des risques ?); la gestion du temps, le rythme de travail, la charge de travail et le niveau de fatigue; la répartition des tâches et la qualité de la supervision sur le terrain. Plusieurs choix possibles."
                  Color: =cTexte2
                  Size: =10.5
                  AutoHeight: =true
                  Wrap: =true
            - enq_galFactOrganisation:
