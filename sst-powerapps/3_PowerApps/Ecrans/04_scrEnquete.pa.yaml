                  FontWeight: =FontWeight.Semibold
                  AutoHeight: =true
                  Wrap: =true
                  PaddingTop: =6
            - enq_aideFactEnvironnement:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="Cet axe examine le milieu physique et le matériel utilisé au moment de l'évènement. L'objectif est d'identifier toutes les anomalies ou contraintes matérielles ayant pu jouer un rôle déclencheur ou aggravant. Ce qu'on évalue : l'état des équipements (outils, machines, équipements de protection individuelle); l'entretien, le bon fonctionnement et la présence des protecteurs/dispositifs de sécurité; les conditions des lieux (éclairage, bruit, température, ventilation, encombrement du sol, état des surfaces); la disposition et l'ergonomie du poste de travail. Plusieurs choix possibles."
                  Color: =cTexte2
                  Size: =10.5
                  AutoHeight: =true
                  Wrap: =true
