            - enq_navBas:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  Height: =60
                  PaddingTop: =16
                  FillPortions: =0
                Children:
                  - enq_btnSauverBas:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="☁️ Enregistrer l'enquête"
                        OnSelect: |-
                          =UpdateContext({locManquants: Concat(Filter(Table(
                              {c: "Facteurs constatés", ok: !(true) || !(IsBlank(Concat(Filter(enq_galFactOrganisation.AllItems, enq_chkFactOrganisation.Value), Value, "; ")))},
                              {c: "Facteurs constatés", ok: !(true) || !(IsBlank(Concat(Filter(enq_galFactEnvironnement.AllItems, enq_chkFactEnvironnement.Value), Value, "; ")))},
                              {c: "Facteurs constatés", ok: !(true) || !(IsBlank(Concat(Filter(enq_galFactComportement.AllItems, enq_chkFactComportement.Value), Value, "; ")))},
                              {c: "Mesures suggérées", ok: !(true) || !(IsBlank(Concat(Filter(enq_galMesuresSuggerees.AllItems, enq_chkMesuresSuggerees.Value), Value, "; ")))},
                              {c: "Le gestionnaire opérationnel est-il en accord avec la version du travailleur ?", ok: !(true) || !(IsBlank(enq_rdoGestAccord.Selected.Value))},
                              {c: "Description détaillée de l'évènement selon le gestionnaire opérationnel", ok: !((enq_rdoGestAccord.Selected.Value = "Non") && (true)) || !(IsBlank(enq_txmGestVersion.Text))}), !ok), c, " • ")});
                          IfError(
                            Set(varDossier, Patch(SST_Dossiers, varDossier, {FactOrganisation: Concat(Filter(enq_galFactOrganisation.AllItems, enq_chkFactOrganisation.Value), Value, "; "),
                            FactOrgAutre: enq_txtFactOrgAutre.Text,
                            FactEnvironnement: Concat(Filter(enq_galFactEnvironnement.AllItems, enq_chkFactEnvironnement.Value), Value, "; "),
                            FactEnvAutre: enq_txtFactEnvAutre.Text,
                            FactComportement: Concat(Filter(enq_galFactComportement.AllItems, enq_chkFactComportement.Value), Value, "; "),
                            FactCompAutre: enq_txtFactCompAutre.Text,
                            MesuresSuggerees: Concat(Filter(enq_galMesuresSuggerees.AllItems, enq_chkMesuresSuggerees.Value), Value, "; "),
                            MesuresSuggAutre: enq_txtMesuresSuggAutre.Text,
                            GestAccord: enq_rdoGestAccord.Selected.Value,
                            GestVersion: enq_txmGestVersion.Text,
                            EnqueteurNom: enq_txtEnqueteurNom.Text,
                            DateEnquete: If(IsBlank(locManquants), Coalesce(varDossier.DateEnquete, Today()), varDossier.DateEnquete),
                            Statut: If(varDossier.Statut = "Fermé", "Fermé", IsBlank(locManquants), If(varDossier.Statut in ["Plan d'action"], varDossier.Statut, "Analyse en cours"), "Enquête en cours")}));
                            Notify(If(IsBlank(locManquants), "Enquête enregistrée et complète.", "Enquête enregistrée (incomplète : " & locManquants & ")"), If(IsBlank(locManquants), NotificationType.Success, NotificationType.Warning)),
                            Notify("Erreur : " & FirstError.Message, NotificationType.Error))
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cVert
                        Color: =Color.White
                        BorderThickness: =0
                        HoverFill: =ColorFade(cVert, -0.15)
                        PressedFill: =ColorFade(cVert, -0.3)
                        HoverColor: =Color.White
                        PressedColor: =Color.White
                        Width: =230
                        Height: =38
                  - enq_btnVersAnalyse:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="🌳 Passer à l'analyse 5 Pourquoi →"
                        OnSelect: |-
                          =Select(enq_btnSauverBas);
                          Navigate(scrAnalyse, ScreenTransition.None)
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cBleu
                        Color: =Color.White
                        BorderThickness: =0
                        HoverFill: =ColorFade(cBleu, -0.15)
                        PressedFill: =ColorFade(cBleu, -0.3)
                        HoverColor: =Color.White
                        PressedColor: =Color.White
                        Width: =300
                        Height: =38
