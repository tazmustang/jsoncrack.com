            - sit_navBas:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  Height: =60
                  PaddingTop: =16
                  FillPortions: =0
                Children:
                  - sit_btnDeposerBas:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="☁️ Enregistrer et déposer"
                        OnSelect: |-
                          =UpdateContext({locManquants: Concat(Filter(Table(
                              {c: "Votre nom", ok: !(true) || !(IsBlank(sit_txtEmpNom.Text))},
                              {c: "Votre prénom", ok: !(true) || !(IsBlank(sit_txtEmpPrenom.Text))},
                              {c: "Votre ID", ok: !(true) || !(IsBlank(sit_txtEmpID.Text))},
                              {c: "Votre unité administrative", ok: !(true) || !(IsBlank(sit_drpEmpService.Selected.Value))},
                              {c: "Votre courriel", ok: !(true) || !(IsBlank(sit_txtEmpCourriel.Text))},
                              {c: "Courriel (format invalide)", ok: !(true) || !(!IsMatch(sit_txtEmpCourriel.Text, Match.Email))},
                              {c: "En avez-vous discuté avec votre gestionnaire ?", ok: !(true) || !(IsBlank(sit_rdoDiscuteGest.Selected.Value))},
                              {c: "Désirez-vous que votre syndicat / association soit mis en copie de votre signalement ?", ok: !(true) || !(IsBlank(sit_rdoSyndicatCopie.Selected.Value))},
                              {c: "Syndicat / association auquel vous êtes rattaché et qui sera mis en copie", ok: !((sit_rdoSyndicatCopie.Selected.Value = "Oui") && (true)) || !(IsBlank(sit_drpEmpSyndicat.Selected.Value))},
                              {c: "Indiquez l'adresse et le lieu précis où vous avez observé la situation dangereuse", ok: !(true) || !(IsBlank(sit_txtEvtAdresse.Text))},
                              {c: "Date de l'observation", ok: !(true) || !(IsBlank(sit_dteEvtDate.SelectedDate))},
                              {c: "Décrire brièvement la situation dangereuse que vous avez observée", ok: !(true) || !(IsBlank(sit_txmDescription.Text))},
                              {c: "Décrire les mesures de prévention immédiates ou correctives que vous suggérez", ok: !(true) || !(IsBlank(sit_txmMesurePrev.Text))}), !ok), c, " • ")});
                          If(!IsBlank(locManquants),
                            Notify("Champs obligatoires à compléter : " & locManquants, NotificationType.Error),
                            IfError(
                            Set(varDossier, Patch(SST_Dossiers, If(IsBlank(varDossier.ID), Defaults(SST_Dossiers), varDossier),
                            {EmpNom: sit_txtEmpNom.Text,
                            EmpPrenom: sit_txtEmpPrenom.Text,
                            EmpID: sit_txtEmpID.Text,
                            EmpService: sit_drpEmpService.Selected.Value,
                            EmpCourriel: sit_txtEmpCourriel.Text,
                            DiscuteGest: sit_rdoDiscuteGest.Selected.Value,
                            SyndicatCopie: sit_rdoSyndicatCopie.Selected.Value,
                            EmpSyndicat: sit_drpEmpSyndicat.Selected.Value,
                            EvtAdresse: sit_txtEvtAdresse.Text,
                            EvtDate: sit_dteEvtDate.SelectedDate,
                            Description: sit_txmDescription.Text,
                            MesurePrev: sit_txmMesurePrev.Text,
                            TypeFormulaire: "Situation dangereuse",
                            Title: "Situation dangereuse – " & sit_txtEmpNom.Text & ", " & sit_txtEmpPrenom.Text & " – " & Text(sit_dteEvtDate.SelectedDate, "yyyy-mm-dd"),
                            CreeParCourriel: Coalesce(varDossier.CreeParCourriel, varMoi),
                            CreeParNom: Coalesce(varDossier.CreeParNom, User().FullName),
                            Statut: If(IsBlank(varDossier.Statut) || varDossier.Statut = "Brouillon", "Déposé", varDossier.Statut),
                            DateDeclaration: Coalesce(varDossier.DateDeclaration, Today())}));
                            Notify("Dossier n° " & varDossier.ID & " déposé.", NotificationType.Success);
                            Set(varAutoEnvoi, true);
                            Navigate(scrApercu, ScreenTransition.None),
                            Notify("Erreur d'enregistrement : " & FirstError.Message, NotificationType.Error)))
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cVert
                        Color: =Color.White
                        BorderThickness: =0
                        HoverFill: =ColorFade(cVert, -0.15)
                        PressedFill: =ColorFade(cVert, -0.3)
                        HoverColor: =Color.White
                        PressedColor: =Color.White
                        Width: =240
                        Height: =38
