# ÉCRAN : scrDetails (détail + approuver / rejeter / annuler)
# 1. Créez un écran vide nommé scrDetails
# 2. Sélectionnez scrDetails dans l'arborescence
# 3. Copiez TOUT ce fichier et faites Ctrl+V
- recDetHeader:
    Control: Rectangle@2.3.0
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =80
      Fill: =RGBA(0, 120, 212, 1)
- btnDetBack:
    Control: Classic/Button@2.2.0
    Properties:
      X: =16
      Y: =18
      Width: =120
      Height: =44
      Text: ="< Retour"
      OnSelect: =Back()
      Fill: =RGBA(0, 120, 212, 1)
      Color: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(255, 255, 255, 1)
      BorderThickness: =1
- lblDetHeader:
    Control: Label@2.5.1
    Properties:
      X: =160
      Y: =0
      Width: =Parent.Width - 400
      Height: =80
      Text: ="Demande n° " & varItem.ID
      Color: =RGBA(255, 255, 255, 1)
      Size: =22
      FontWeight: =FontWeight.Bold
- lblDetStatus:
    Control: Label@2.5.1
    Properties:
      X: =Parent.Width - 224
      Y: =20
      Width: =200
      Height: =40
      Text: =varItem.Status.Value
      Align: =Align.Center
      FontWeight: =FontWeight.Bold
      Color: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(255, 255, 255, 1)
      BorderThickness: =1
      Fill: |-
        =Switch(
            varItem.Status.Value,
            "Approuvé", RGBA(16, 124, 16, 1),
            "Rejeté", RGBA(196, 43, 28, 1),
            "Annulé", RGBA(120, 120, 120, 1),
            RGBA(202, 80, 16, 1)
        )
- lblDetTitle:
    Control: Label@2.5.1
    Properties:
      X: =40
      Y: =100
      Width: =Parent.Width - 80
      Height: =44
      Text: =varItem.Title
      Size: =20
      FontWeight: =FontWeight.Bold
- lblDetInfo:
    Control: Label@2.5.1
    Properties:
      X: =40
      Y: =150
      Width: =620
      Height: =220
      VerticalAlign: =VerticalAlign.Top
      Size: =14
      Text: |-
        ="Catégorie : " & varItem.Category.Value & Char(10) &
        "Montant : " & Text(varItem.Amount, "#,##0.00") & " $" & Char(10) &
        "Demandeur : " & varItem.'Created By'.DisplayName & Char(10) &
        "Date de la demande : " & Text(varItem.Created, "dd/mm/yyyy hh:mm") & Char(10) &
        "Approbateur : " & varItem.Approver.DisplayName & Char(10) &
        "Date de décision : " & If(IsBlank(varItem.DecisionDate), "-", Text(varItem.DecisionDate, "dd/mm/yyyy hh:mm"))
- lblDetDescTitle:
    Control: Label@2.5.1
    Properties:
      X: =40
      Y: =380
      Width: =620
      Height: =30
      Text: ="Description"
      FontWeight: =FontWeight.Semibold
- lblDetDescription:
    Control: Label@2.5.1
    Properties:
      X: =40
      Y: =410
      Width: =620
      Height: =140
      VerticalAlign: =VerticalAlign.Top
      Text: =If(IsBlank(varItem.Description), "(aucune)", varItem.Description)
      Fill: =RGBA(245, 245, 245, 1)
      PaddingLeft: =10
      PaddingTop: =10
- lblDetCommentsTitle:
    Control: Label@2.5.1
    Properties:
      X: =40
      Y: =560
      Width: =620
      Height: =30
      Text: ="Commentaire de l'approbateur"
      FontWeight: =FontWeight.Semibold
      Visible: =!IsBlank(varItem.ApproverComments)
- lblDetComments:
    Control: Label@2.5.1
    Properties:
      X: =40
      Y: =590
      Width: =620
      Height: =100
      VerticalAlign: =VerticalAlign.Top
      Text: =varItem.ApproverComments
      Fill: =RGBA(245, 245, 245, 1)
      PaddingLeft: =10
      PaddingTop: =10
      Visible: =!IsBlank(varItem.ApproverComments)
- recApprovePanel:
    Control: Rectangle@2.3.0
    Properties:
      X: =700
      Y: =150
      Width: =Parent.Width - 740
      Height: =360
      Fill: =RGBA(243, 249, 253, 1)
      BorderColor: =RGBA(0, 120, 212, 1)
      BorderThickness: =1
      Visible: =Lower(varItem.Approver.Email) = Lower(User().Email) && varItem.Status.Value = "En attente"
- lblApproveTitle:
    Control: Label@2.5.1
    Properties:
      X: =720
      Y: =160
      Width: =Parent.Width - 780
      Height: =40
      Text: ="Votre décision"
      Size: =16
      FontWeight: =FontWeight.Bold
      Visible: =recApprovePanel.Visible
- txtApproverComment:
    Control: Classic/TextInput@2.3.2
    Properties:
      X: =720
      Y: =210
      Width: =Parent.Width - 780
      Height: =160
      Default: =""
      Mode: =TextMode.MultiLine
      HintText: ="Commentaire (obligatoire pour un rejet)"
      Visible: =recApprovePanel.Visible
- btnApprove:
    Control: Classic/Button@2.2.0
    Properties:
      X: =720
      Y: =390
      Width: =(Parent.Width - 800) / 2
      Height: =48
      Text: ="Approuver"
      Fill: =RGBA(16, 124, 16, 1)
      Color: =RGBA(255, 255, 255, 1)
      Visible: =recApprovePanel.Visible
      OnSelect: |-
        =IfError(
            Set(
                varItem,
                Patch(
                    ApprovalRequests,
                    varItem,
                    {
                        Status: {Value: "Approuvé"},
                        ApproverComments: txtApproverComment.Text,
                        DecisionDate: Now()
                    }
                )
            ),
            Notify("Erreur : " & FirstError.Message, NotificationType.Error),
            Notify("Demande approuvée", NotificationType.Success);
            Reset(txtApproverComment)
        )
- btnReject:
    Control: Classic/Button@2.2.0
    Properties:
      X: =740 + (Parent.Width - 800) / 2
      Y: =390
      Width: =(Parent.Width - 800) / 2
      Height: =48
      Text: ="Rejeter"
      Fill: =RGBA(196, 43, 28, 1)
      Color: =RGBA(255, 255, 255, 1)
      Visible: =recApprovePanel.Visible
      OnSelect: |-
        =If(
            IsBlank(txtApproverComment.Text),
            Notify("Indiquez la raison du rejet dans le commentaire.", NotificationType.Warning),
            IfError(
                Set(
                    varItem,
                    Patch(
                        ApprovalRequests,
                        varItem,
                        {
                            Status: {Value: "Rejeté"},
                            ApproverComments: txtApproverComment.Text,
                            DecisionDate: Now()
                        }
                    )
                ),
                Notify("Erreur : " & FirstError.Message, NotificationType.Error),
                Notify("Demande rejetée", NotificationType.Success);
                Reset(txtApproverComment)
            )
        )
- btnCancelRequest:
    Control: Classic/Button@2.2.0
    Properties:
      X: =700
      Y: =530
      Width: =300
      Height: =48
      Text: ="Annuler ma demande"
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(196, 43, 28, 1)
      BorderColor: =RGBA(196, 43, 28, 1)
      BorderThickness: =1
      Visible: =Lower(varItem.'Created By'.Email) = Lower(User().Email) && varItem.Status.Value = "En attente"
      OnSelect: |-
        =IfError(
            Set(varItem, Patch(ApprovalRequests, varItem, {Status: {Value: "Annulé"}})),
            Notify("Erreur : " & FirstError.Message, NotificationType.Error),
            Notify("Demande annulée", NotificationType.Information)
        )
